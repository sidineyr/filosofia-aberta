name: Atualização
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm test
      - run: |
          mkdir _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='node_modules/' --exclude='scripts/' --exclude='tests/' --exclude='.env*' ./ _site/
          touch _site/.nojekyll
      - name: Atualização
        run: |
          git fetch origin gh-pages
          git worktree add _publish origin/gh-pages
          rsync -a --exclude='.git' _site/ _publish/
          git -C _publish config user.name 'Sidiney Rodrigues'
          git -C _publish config user.email '4397607+sidineyr@users.noreply.github.com'
          git -C _publish add .
          if ! git -C _publish diff --cached --quiet; then
            git -C _publish commit -m 'Atualização'
            git -C _publish push origin HEAD:gh-pages
          fi
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

